name: Quality Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *' # Daily at 14:00 UTC
    - cron: '0 15 * * 1' # Weekly on Monday at 15:00 UTC

jobs:
  quality-loop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Run quality loop
        run: npm run quality:check

      - name: Upload quality report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: reports/quality/latest.md
          if-no-files-found: error
